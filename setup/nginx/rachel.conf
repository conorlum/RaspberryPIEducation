# Reverse proxy fronting the Pi's hotspot traffic.
#
# Flask (routes.py) already owns the captive-portal probe paths and the
# catch-all redirect, so this config only needs two routes: kiwix content,
# and everything else to Flask.
server {
    listen 80 default_server;
    server_name _;

    # No trailing slash on proxy_pass here: kiwix-serve is started with
    # --urlRootLocation /kiwix (see setup/systemd/kiwix-serve.service), so it
    # expects to see - and generates its own internal links with - the
    # /kiwix prefix intact. A trailing slash would make nginx strip the
    # prefix before forwarding, which breaks kiwix-serve's self-referential
    # links (content, search, viewer) once you're a level deep in a ZIM.
    location /kiwix/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
